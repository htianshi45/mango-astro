# Sveltia CMS · Mango Astro
# 文档：https://sveltia-cms.netlify.app/
#
# 当前为已上线的生产配置（无需再替换占位符）：
#   backend.repo        = htianshi45/mango-astro
#   backend.base_url    = 自建 Cloudflare Worker OAuth 网关 https://auth.840428.xyz
#   backend.site_domain = 站点标识，用于 OAuth site_id；网关白名单需包含它
# 详细步骤见工程根目录《后台接入-操作清单.md》与《站点管理与设置教程》
#
# ⚠️ 每个 collection 的 fields 必须列全对应 schema 的字段：
#    CMS 保存已有条目时会重写整个 frontmatter，未列出的字段会被抹掉。
#    构建前 scripts/check-content.mjs 会再校验一遍 URL 别名、日期与枚举。

backend:
  name: github
  repo: htianshi45/mango-astro
  branch: main
  base_url: https://auth.840428.xyz
  auth_endpoint: auth
  site_domain: mango.840428.xyz
  # scope 由 CMS 弹窗传给网关（私有仓库 repo / 公开仓库 public_repo）
  auth_scope: repo

# CMS 上传的图片写入仓库 public/images/uploads，前端用 /images/uploads/xxx 引用
media_folder: public/images/uploads
public_folder: /images/uploads

collections:
  # ---------------- 站点设置（单文件集合） ----------------
  # files 类型 = 编辑仓库里某个单独的数据文件，而不是一整个文件夹。
  # 这里只挂导航栏：数据在 src/data/navigation.json，site.ts 直接 import 它，
  # 所以后台改完 → 提交 → 重新构建就生效，不需要碰任何 .ts 源码。
  - name: settings
    label: 站点设置
    files:
      - name: navigation
        label: 导航栏
        file: src/data/navigation.json
        # 说明：这是 JSON 数据，不是文章；改完记得等一次构建
        description: >-
          导航分「一级项」和「子菜单」。href 填 /archive 这类站内路径，
          只想当分组标题时填 # ；page 选页面开关键（留空 = 不受开关控制）。
          子菜单里也能单独设 page，整组子项都被关掉时该分组会自动隐藏。
        fields:
          - label: 一级导航项
            name: items
            widget: list
            summary: "{{fields.name}} → {{fields.href}}"
            fields:
              - { label: "名称", name: name, widget: string }
              - { label: "链接（/archive 或 #）", name: href, widget: string, default: "#" }
              - { label: "图标类名（bi-house 等）", name: icon, widget: string, required: false }
              - label: 页面开关
                name: page
                widget: select
                required: false
                hint: 留空表示不受页面开关控制
                options:
                  - { label: 主题下载, value: download }
                  - { label: 旅游地图, value: map }
                  - { label: 文章归档, value: archive }
                  - { label: 标签云, value: tags }
                  - { label: 站内搜索, value: search }
                  - { label: 说说, value: moments }
                  - { label: 书签导航, value: bookmarks }
                  - { label: 收藏四库, value: favorites }
              - { label: "外链（新窗口打开）", name: external, widget: boolean, default: false, required: false }
              - label: 子菜单
                name: children
                widget: list
                required: false
                summary: "{{fields.name}} → {{fields.href}}"
                hint: 留空就是普通链接，不显示下拉箭头
                fields:
                  - { label: "名称", name: name, widget: string }
                  - { label: "链接", name: href, widget: string }
                  - { label: "图标类名", name: icon, widget: string, required: false }
                  - label: 页面开关
                    name: page
                    widget: select
                    required: false
                    options:
                      - { label: 主题下载, value: download }
                      - { label: 旅游地图, value: map }
                      - { label: 文章归档, value: archive }
                      - { label: 标签云, value: tags }
                      - { label: 站内搜索, value: search }
                      - { label: 说说, value: moments }
                      - { label: 书签导航, value: bookmarks }
                      - { label: 收藏四库, value: favorites }
                  - { label: "外链（新窗口打开）", name: external, widget: boolean, default: false, required: false }

  # ---------------- 文章 ----------------
  - name: posts
    label: 文章
    folder: src/content/posts
    create: true
    # 让作者显式填英文短名做文件名，避免中文标题被 slugify 成空文件名
    slug: "{{fields.slug}}"
    summary: "{{title}} · {{pubDate}}"
    editor:
      preview: true
    fields:
      - label: "URL 别名（文件名，小写英文/数字/连字符）"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9-]+$", "只能用小写字母、数字和连字符"]
        hint: "这个字段会直接成为文章网址 /posts/<别名>/。编辑已有文章时请保持与文件名一致，改动会让旧链接失效；新建文章时填英文短名即可。"
      - { label: "标题", name: "title", widget: "string" }
      - { label: "摘要", name: "description", widget: "text", required: false }
      - { label: "发布日期", name: "pubDate", widget: "datetime" }
      - { label: "更新日期", name: "updatedDate", widget: "datetime", required: false }
      - { label: "封面图", name: "heroImage", widget: "image", required: false }
      - label: "九宫格图片（一般留空，正文图片会自动提取）"
        name: "images"
        widget: "list"
        required: false
        field: { label: "图片地址", name: "image", widget: "string" }
      - { label: "作者", name: "author", widget: "string", default: "Mango" }
      - { label: "头像", name: "avatar", widget: "image", default: "/images/default-avatar.svg" }
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "标签", name: "tag", widget: "string" }
      - { label: "分类", name: "category", widget: "string", required: false }
      - { label: "置顶权重", name: "sticky", widget: "number", default: 0, required: false }
      - { label: "浏览量", name: "views", widget: "number", default: 0, required: false }
      - { label: "点赞数", name: "likes", widget: "number", default: 0, required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "正文", name: "body", widget: "markdown", hint: "在正文中按段落插入图片；首页九宫格会自动取正文前 9 张，超出部分显示 +N" }

  # ---------------- 说说（首页混合时间流） ----------------
  - name: moments
    label: 说说
    folder: src/content/moments
    create: true
    # 用发布时间自动生成文件名，作者不必手填 ID；fields 里刻意不放 slug，
    # 避免 Astro 把 frontmatter slug 当成条目 ID。
    slug: "{{year}}-{{month}}-{{day}}-{{hour}}-{{minute}}-{{second}}"
    summary: "{{published}} · {{location}}"
    editor:
      preview: true
    fields:
      - { label: "发布时间", name: "published", widget: "datetime" }
      - { label: "更新时间", name: "updatedDate", widget: "datetime", required: false }
      - { label: "置顶", name: "pinned", widget: "boolean", default: false, required: false }
      - { label: "地点", name: "location", widget: "string", required: false }
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "标签", name: "tag", widget: "string" }
      - { label: "作者", name: "author", widget: "string", default: "Mango", required: false }
      - { label: "头像", name: "avatar", widget: "image", default: "/images/default-avatar.svg", required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "内容", name: "body", widget: "markdown", hint: "短内容 + 可选图片；图片会自动走九宫格与灯箱，首页按发布时间和文章交替显示" }

  # ---------------- 收藏（收藏夹 / 书架 / 片库 / 音乐库） ----------------
  - name: favorites
    label: 收藏条目
    folder: src/content/favorites
    create: true
    slug: "{{fields.slug}}"
    summary: "{{title}} · {{category}} · {{status}}"
    editor:
      preview: true
    fields:
      - label: "条目 ID（文件名，小写英文/数字/连字符）"
        name: "slug"
        widget: "string"
        pattern: ["^[a-z0-9-]+$", "只能用小写字母、数字和连字符"]
        hint: "编辑已有条目时保持与文件名一致；改动会改变条目 ID。"
      - { label: "名称", name: "title", widget: "string" }
      - label: "所属库"
        name: "category"
        widget: "select"
        options:
          - { label: "收藏夹", value: "bookmarks" }
          - { label: "书架", value: "books" }
          - { label: "片库", value: "movies" }
          - { label: "音乐库", value: "music" }
      - { label: "封面图", name: "cover", widget: "image", required: false, hint: "留空则显示名称首字母占位" }
      - { label: "一句话简介", name: "description", widget: "text", required: false }
      - label: "状态"
        name: "status"
        widget: "select"
        default: "done"
        options:
          - { label: "待办 / 想读想看", value: "wish" }
          - { label: "进行中", value: "doing" }
          - { label: "已完成", value: "done" }
          - { label: "精选 / 最爱", value: "favorite" }
      - { label: "评分（0–10，0 为未评分）", name: "rating", widget: "number", default: 0, min: 0, max: 10, required: false }
      - { label: "进度（0–100）", name: "progress", widget: "number", default: 0, min: 0, max: 100, required: false }
      - { label: "外链", name: "url", widget: "string", required: false }
      - { label: "作者 / 导演 / 歌手 / 站点", name: "creator", widget: "string", required: false }
      - { label: "年份", name: "year", widget: "string", required: false }
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
        field: { label: "标签", name: "tag", widget: "string" }
      - { label: "加入时间", name: "addedAt", widget: "datetime" }
      - { label: "排序权重（越大越靠前）", name: "weight", widget: "number", default: 0, required: false }
      - { label: "草稿", name: "draft", widget: "boolean", default: false, required: false }
      - { label: "短评", name: "body", widget: "markdown", required: false }

# 说明：没有配置 pages collection。原模板里的 "关于页面" 指向 src/pages/about.astro，
# 那是 Astro 组件而非 Markdown；用 CMS 的 markdown widget 编辑会写坏组件文件。
# 书签导航是站点配置（src/config/bookmarks.ts），不在 CMS 里管理，避免误改 TS 文件。
