# 手动应急部署（push 不再触发）
#
# 2026-11 起站点迁到「Git 集成」项目 mango-astro-git：push 到 main 由 Cloudflare
# 自己的构建机直接编译部署，本 workflow 若仍监听 push 会造成同一个提交部署两次。
# 所以这里只保留 workflow_dispatch（手动 Run workflow），作为 Cloudflare 构建出问题时的
# 应急通道——它部署到同一个项目，产物一致。
#
# 使用前在 GitHub 仓库 Settings → Secrets and variables → Actions 添加：
#   CLOUDFLARE_API_TOKEN   Cloudflare API Token（含 Cloudflare Pages 编辑权限）
#   CLOUDFLARE_ACCOUNT_ID  Cloudflare Account ID
#   INDEXNOW_KEY           （可选）IndexNow 密钥，任意 8-128 位十六进制字符串
#   BAIDU_TOKEN            （可选）百度站长平台的推送 token
name: Deploy to Cloudflare Pages (manual)

on:
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  SITE_URL: https://mango-astro-git.pages.dev
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
  BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # IndexNow 要求根目录下有 <key>.txt，必须在构建之前写进 public/
      - name: Write IndexNow verification file
        run: node scripts/push-indexnow.mjs --write-key

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=mango-astro-git --branch main

      - name: Ping search engines
        run: node scripts/push-indexnow.mjs
