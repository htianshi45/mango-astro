# 🚀 部署到 EdgeOne Makers（2026-11-18 从 Cloudflare Pages 迁移）
#
# 使用前在 GitHub 仓库 Settings → Secrets and variables → Actions 添加：
#   EDGEONE_API_TOKEN      EdgeOne API Token（console 里创建）
#   SITE_URL               站点正式域名（如 https://xxx.edgeone.cool 或自有域名）
#   INDEXNOW_KEY           （可选）IndexNow 密钥，8-128 位十六进制字符串
#   BAIDU_TOKEN            （可选）百度站长平台的推送 token
#
# 手动触发：workflow_dispatch（保留手动应急通道）
# 也可直接在本机执行：PAGES_SOURCE=skills edgeone makers deploy --json
name: Deploy to EdgeOne Makers (manual)

on:
  workflow_dispatch:

concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

env:
  SITE_URL: ${{ secrets.SITE_URL }}
  INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
  BAIDU_TOKEN: ${{ secrets.BAIDU_TOKEN }}
  PAGES_SOURCE: skills

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # IndexNow 要求根目录下有 <key>.txt，必须在构建之前写进 public/
      - name: Write IndexNow verification file
        run: node scripts/push-indexnow.mjs --write-key

      - name: Build
        run: npm run build

      - name: Install EdgeOne CLI
        run: npm install -g edgeone@latest

      - name: Deploy to EdgeOne Makers
        env:
          EDGEONE_PAGES_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: edgeone makers deploy --json

      - name: Ping search engines
        run: node scripts/push-indexnow.mjs
